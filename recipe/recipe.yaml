context:
  version: "0.4.3"

package:
  name: okf-agent-memory
  version: ${{ version }}

source:
  url: https://github.com/okf-memory/okf-agent-memory/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4a4b24ba243be9efe8973309c107a68376f6fd610d9d67ead02c184267e430ef

build:
  number: 0
  script:
    - go-licenses save ./cmd/okf --save_path library_licenses --ignore github.com/okf-memory/okf-agent-memory
    - if: not win
      then:
        - go build -v -trimpath -ldflags="-s -w -X main.Version=${PKG_VERSION}" -o "${PREFIX}/bin/okf" ./cmd/okf
      else:
        - go build -v -trimpath -ldflags="-s -w -X main.Version=%PKG_VERSION%" -o "%LIBRARY_BIN%\okf.exe" ./cmd/okf
        - if %ERRORLEVEL% neq 0 exit 1

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - okf version
      - okf help
      - okf help validate

about:
  homepage: https://github.com/okf-memory/okf-agent-memory
  summary: Domain-neutral, git-native persistent project memory for AI agents based on the Open Knowledge Format (OKF) v0.2
  description: |
    OKF Agent Memory provides the `okf` CLI and MCP server for maintaining a
    persistent, version-controlled project memory for AI agents. Knowledge is
    stored as plain Markdown and YAML in an Open Knowledge Format (OKF) v0.2
    bundle, and the tool offers deterministic parsing, strict validation,
    in-memory BM25 search, and a Model Context Protocol (MCP) server so agents
    can retrieve decisions, facts, and runbooks on demand.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  documentation: https://github.com/okf-memory/okf-agent-memory/tree/main/docs
  repository: https://github.com/okf-memory/okf-agent-memory

extra:
  recipe-maintainers:
    - lsetiawan
